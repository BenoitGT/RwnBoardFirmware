# Sample workflow for building and deploying a MkDocs site to GitHub Pages
name: Deploy GitHub Pages with dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  setup-env:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      # Checkout doc data
      - name: Checkout
        uses: actions/checkout@v7
      # Setup python env
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      # install Zensical in python env
      - name: Setup doc builder
        run: pip install zensical

  build-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: setup-env
    steps:
      - name: Build GitHub Pages
        run: zensical build --clean 

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      # Upload result artefact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # publish Github pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
